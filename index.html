<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DecorHub</title>

    <style>

        /* =========================
           BASIC RESET
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: Arial, sans-serif;
        }


       /* =========================
           HOMEPAGE BACKGROUND
        ========================== */

        .homepage {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;

            background-image: url("background.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* =========================
           MOBILE RESPONSIVE BACKGROUND
        ========================== */

        @media (max-width: 768px) {
            .homepage {
                /* Switch to your mobile-optimized vertical image */
                background-image: url("background-mobile.png");
                
                background-size: cover; 
                background-position: center;
            }
        }


        /* =========================
           DARK OVERLAY
        ========================== */

        .overlay {
            position: absolute;
            inset: 0;

            background: rgba(0, 0, 0, 0.10);

            z-index: 1;
        }


        /* =========================
           HYPEHAUS LOGO
        ========================== */

        .logo-container {
            position: absolute;

            top: 14px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 2;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
        }

        .logo {
            width: min(140px, 35vw);
            max-width: 140px;
            height: auto;

            filter: drop-shadow(
                0 4px 24px rgba(0, 0, 0, 0.5)
            );
        }



        /* =========================
           TOP LEFT CLOCK
        ========================== */

        .clock {
            position: fixed;
            left: 20px;
            top: 20px;
            z-index: 20;
            font-size: 14px;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            color: white;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
        }

        .clock-colon {
            animation: blink 1s step-end infinite;
        }

        .clock-period {
            margin-left: 6px;
            color: rgba(255, 255, 255, 0.7);
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }


        /* =========================
           TOP LEFT MENU BAR (3 LINES)
        ========================== */

        .menu-container {
            position: fixed;
            left: 20px;
            top: 60px;
            z-index: 30;
        }

        .menu-toggle {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 32px;
            height: 24px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 31;
        }

        .menu-toggle span {
            width: 100%;
            height: 3px;
            background-color: rgb(0, 0, 0);
            border-radius: 2px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        /* Dropdown Navigation Menu */
        .nav-menu {
            position: absolute;
            top: 36px;
            left: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            overflow: hidden;
            width: 130px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            display: none;
            flex-direction: column;
        }

        .nav-menu.active {
            display: flex;
        }

        .nav-menu a {
            color: white;
            text-decoration: none;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s ease;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .nav-menu a:last-child {
            border-bottom: none;
        }

        .nav-menu a:hover {
            background: rgba(255, 255, 255, 0.15);
        }


        /* =========================
           MUSIC PLAYER
        ========================== */

        .music-player {
            position: absolute;

            left: 50%;
            bottom: 50px; /* Raised slightly to give room for the footer */
            transform: translateX(-50%);

            z-index: 10;

            display: flex;
            align-items: center;
            gap: 16px;

            width: min(420px, calc(100vw - 40px));

            padding: 8px 14px 8px 8px;

            border-radius: 999px;

            background: rgba(255, 255, 255, 0.10);

            backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%);

            border: 1px solid rgba(255, 255, 255, 0.20);

            box-shadow:
                0 8px 40px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);

            color: white;
        }


        /* =========================
           ALBUM COVER
        ========================== */

        .album-wrapper {
            position: relative;

            width: 58px;
            height: 58px;

            flex-shrink: 0;
        }

        .album-cover {
            width: 100%;
            height: 100%;

            overflow: hidden;
            border-radius: 50%;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.40);

            border: 1px solid rgba(255, 255, 255, 0.20);
        }

        .album-cover img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }

        .album-wrapper.playing .album-cover {
            animation: spin 8s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .album-center {
            pointer-events: none;

            position: absolute;

            top: 50%;
            left: 50%;

            width: 12px;
            height: 12px;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background: rgba(0, 0, 0, 0.70);

            border: 2px solid rgba(255, 255, 255, 0.40);
        }


        /* =========================
           SONG INFORMATION
        ========================== */

        .song-info {
            min-width: 0;
            flex: 1;
        }

        .song-title {
            overflow: hidden;

            white-space: nowrap;
            text-overflow: ellipsis;

            font-size: 13px;
            font-weight: 600;

            color: white;

            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.30);
        }

        .song-artist {
            margin-top: 4px;

            overflow: hidden;

            white-space: nowrap;
            text-overflow: ellipsis;

            font-size: 11px;

            color: rgba(255, 255, 255, 0.70);
        }


        /* =========================
           PROGRESS BAR
        ========================== */

        .progress-area {
            margin-top: 10px;
        }

        .progress-bar {
            position: relative;

            width: 100%;
            height: 8px;

            cursor: pointer;
        }

        .progress-background {
            position: absolute;

            left: 0;
            right: 0;
            top: 50%;

            height: 4px;

            transform: translateY(-50%);

            overflow: hidden;

            border-radius: 999px;

            background: rgba(255, 255, 255, 0.20);
        }

        .progress-fill {
            width: 0%;
            height: 100%;

            border-radius: 999px;

            background: rgba(255, 255, 255, 0.90);
        }

        .progress-knob {
            position: absolute;

            top: 50%;
            left: 0%;

            width: 12px;
            height: 12px;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background: white;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.40);

            opacity: 0;

            transition: opacity 0.2s ease;
        }

        .progress-bar:hover .progress-knob {
            opacity: 1;
        }

        .time {
            margin-top: 7px;

            text-align: left;

            font-size: 11px;

            color: rgba(255, 255, 255, 0.60);
        }


        /* =========================
           MUSIC CONTROLS
        ========================== */

        .music-controls {
            display: flex;
            align-items: center;
            gap: 4px;

            flex-shrink: 0;
        }

        .control-btn {
            display: grid;
            place-items: center;

            width: 36px;
            height: 36px;

            border: none;
            border-radius: 50%;

            background: transparent;

            color: rgba(255, 255, 255, 0.80);

            cursor: pointer;

            transition: all 0.2s ease;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .play-btn {
            width: 44px;
            height: 44px;

            background: white;
            color: black;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.30);
        }

        .play-btn:hover {
            background: white;
            color: black;

            transform: scale(1.05);
        }

        .control-btn svg {
            width: 20px;
            height: 20px;
        }


        /* =========================
           FOOTER
        ========================== */

        .site-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            text-align: center;
            padding: 8px 0;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.65);
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            letter-spacing: 0.3px;
        }


        /* =========================
           MOBILE RESPONSIVE FIXES
        ========================== */

        @media (max-width: 768px) {

            /* Hide clock on mobile screens */
            .clock {
                display: none;
            }

            .menu-container {
                top: 20px;
            }

            .logo-container {
                top: 12px;
            }

            .logo {
                width: min(115px, 35vw);
                max-width: 115px;
            }

            /* Adjust player layout for mobile to prevent cutoff */
            .music-player {
                left: 50%;
                right: auto;
                bottom: 42px; /* Lifted slightly above footer */
                transform: translateX(-50%);

                width: calc(100vw - 20px);
                max-width: 380px;

                flex-wrap: wrap;
                gap: 8px;

                padding: 10px;
                border-radius: 16px;
            }

            .album-wrapper {
                width: 45px;
                height: 45px;
            }

            .song-info {
                flex: 1;
                min-width: 0;
            }

            .music-controls {
                width: 100%;
                justify-content: center;
                gap: 12px;
                margin-top: 2px;
                border-top: 1px solid rgba(255, 255, 255, 0.1);
                padding-top: 6px;
            }

            .control-btn {
                width: 34px;
                height: 34px;
            }

            .play-btn {
                width: 38px;
                height: 38px;
            }

            .song-title {
                font-size: 12px;
            }

            .song-artist {
                font-size: 10px;
                margin-top: 2px;
            }

            .progress-area {
                margin-top: 5px;
            }

            .time {
                font-size: 10px;
                margin-top: 3px;
            }

            .site-footer {
                font-size: 10px;
                padding: 6px 0;
            }
        }



        /* =========================
           LIVE VIEWERS
        ========================== */

        .live-viewers {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 20;

            display: flex;
            align-items: center;
            gap: 8px;

            padding: 10px 14px;

            color: white;
            font-size: 13px;
            font-weight: 600;

            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 999px;

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #38d39f;
            box-shadow: 0 0 0 0 rgba(56, 211, 159, 0.7);
            animation: livePulse 1.5s infinite;
        }

        @keyframes livePulse {
            0% {
                box-shadow: 0 0 0 0 rgba(56, 211, 159, 0.7);
            }
            70% {
                box-shadow: 0 0 0 8px rgba(56, 211, 159, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(56, 211, 159, 0);
            }
        }

        @media (max-width: 768px) {
            .live-viewers {
                top: 15px;
                right: 15px;
                padding: 8px 11px;
                font-size: 11px;
            }
        }

    </style>
</head>


<body>

    <main class="homepage">


        <!-- DARK OVERLAY -->
        <div class="overlay"></div>


        <!-- TOP LEFT CLOCK -->
        <div class="clock" id="clock" aria-label="Current time"></div>

        <!-- TOP LEFT 3-LINE MENU BAR -->
        <div class="menu-container">
            <button class="menu-toggle" id="menuToggle" aria-label="Toggle Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav class="nav-menu" id="navMenu">
                <a href="#home">Home</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>

        <!-- LIVE VIEWER COUNTER -->
        <div class="live-viewers" id="liveViewers">
            <span class="live-dot"></span>
            <span id="viewerCount">45</span> watching now
        </div>


       

        <!-- =========================
             HYPEHAUS CENTER LOGO
        ========================== -->

        <div class="logo-container">

            <img
                src="logo.png"
                alt="DecorHub"
                width="930"
                height="627"
                class="logo"
            >

        </div>


        <!-- =========================
             MUSIC PLAYER
        ========================== -->

        <div class="music-player">


            <!-- ALBUM COVER -->

            <div
                class="album-wrapper"
                id="albumWrapper"
            >

                <div class="album-cover">

                    <img
                        id="albumCoverImg"
                        src="covers/N0jnLZxYwYc.jpg"
                        alt="Album Cover"
                    >

                </div>

                <div class="album-center"></div>

            </div>


            <!-- SONG INFORMATION -->

            <div class="song-info">

                <p class="song-title" id="songTitle">
                   Nake Peri Nathdi Tame Bahu Rupala Lago Cho
                </p>

                <p class="song-artist" id="songArtist">
                    Song by Rakesh Barot
                </p>


                <!-- PROGRESS BAR -->

                <div class="progress-area">

                    <div
                        class="progress-bar"
                        id="progressBar"
                    >

                        <div class="progress-background">

                            <div
                                class="progress-fill"
                                id="progressFill"
                            ></div>

                        </div>

                        <div
                            class="progress-knob"
                            id="progressKnob"
                        ></div>

                    </div>


                    <div
                        class="time"
                        id="timeDisplay"
                    >
                        0:00 / 0:00
                    </div>

                </div>

            </div>


            <!-- CONTROLS -->

            <div class="music-controls">


                <!-- PREVIOUS -->

                <button
                    type="button"
                    class="control-btn"
                    id="prevButton"
                    aria-label="Previous track"
                >

                    <svg
                        viewBox="0 0 24 24"
                        fill="currentColor"
                    >
                        <path
                            d="M6 6h2v12H6zm3.5 6l8.5 6V6z"
                        ></path>
                    </svg>

                </button>


                <!-- PLAY / PAUSE -->

                <button
                    type="button"
                    class="control-btn play-btn"
                    id="playButton"
                    aria-label="Play"
                >

                    <svg
                        id="playIcon"
                        viewBox="0 0 24 24"
                        fill="currentColor"
                    >
                        <path
                            d="M8 5v14l11-7z"
                        ></path>
                    </svg>

                </button>


                <!-- NEXT -->

                <button
                    type="button"
                    class="control-btn"
                    id="nextButton"
                    aria-label="Next track"
                >

                    <svg
                        viewBox="0 0 24 24"
                        fill="currentColor"
                    >
                        <path
                            d="M16 6h2v12h-2zm-2 6L5.5 6v12z"
                        ></path>
                    </svg>

                </button>


            </div>


            <!-- AUDIO FILE -->

            <audio id="audioPlayer"></audio>


        </div>


        <!-- =========================
             FOOTER
        ========================== -->
        <footer class="site-footer">
            &copy; <span id="currentYear"></span> DecorHub. All rights reserved.
        </footer>


    </main>


    <!-- =========================
         MUSIC PLAYER JAVASCRIPT
    ========================== -->



    <!-- FIREBASE SCRIPTS -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <script>
        // Set dynamic current year in footer
        document.getElementById("currentYear").textContent = new Date().getFullYear();

        const audio = document.getElementById("audioPlayer");

        const playButton =
            document.getElementById("playButton");

        const playIcon =
            document.getElementById("playIcon");

        const progressBar =
            document.getElementById("progressBar");

        const progressFill =
            document.getElementById("progressFill");

        const progressKnob =
            document.getElementById("progressKnob");

        const timeDisplay =
            document.getElementById("timeDisplay");

        const albumWrapper =
            document.getElementById("albumWrapper");

        const songTitle = document.getElementById("songTitle");
        const songArtist = document.getElementById("songArtist");
        const albumCoverImg = document.getElementById("albumCoverImg");
        const prevButton = document.getElementById("prevButton");
        const nextButton = document.getElementById("nextButton");

        // Playlist configuration with two songs
        const playlist = [
            {
                title: "Nake Peri Nathdi Tame Bahu Rupala Lago Cho",
                artist: "Song by Rakesh Barot",
                src: "song.mp3",
                cover: "covers/N0jnLZxYwYc.jpg"
            },
            {
                title: "Aam Gotu Tem Gotu", 
                artist: "Song by Damayanti Bardai", 
                src: "song2.aac",
                cover: "covers/images.jpg" 
            }
        ];

        let currentTrackIndex = 0;

        function loadTrack(index) {
            const track = playlist[index];
            audio.src = track.src;
            songTitle.textContent = track.title;
            songArtist.textContent = track.artist;
            albumCoverImg.src = track.cover;
            audio.load();
        }

        // Initialize first track
        loadTrack(currentTrackIndex);


        /* LIVE CLOCK */

        const clock = document.getElementById("clock");

        function updateClock() {
            const now = new Date();

            const hours24 = now.getHours();
            const hours12 = hours24 % 12 || 12;
            const minutes = now.getMinutes().toString().padStart(2, "0");
            const period = hours24 >= 12 ? "pm" : "am";

            clock.innerHTML =
                `${hours12}<span class="clock-colon">:</span>${minutes}` +
                `<span class="clock-period">${period}</span>`;
        }

        updateClock();
        setInterval(updateClock, 1000);


        /* 3-LINE MENU TOGGLE */

        const menuToggle = document.getElementById("menuToggle");
        const navMenu = document.getElementById("navMenu");

        menuToggle.addEventListener("click", function (event) {
            event.stopPropagation();
            navMenu.classList.toggle("active");
        });

        // Close menu when clicking outside
        document.addEventListener("click", function () {
            navMenu.classList.remove("active");
        });


        /* PLAY / PAUSE */

        playButton.addEventListener("click", function () {

            if (audio.paused) {

                audio.play();

            } else {

                audio.pause();

            }

        });


        /* NEXT & PREVIOUS CONTROLS */

        nextButton.addEventListener("click", function () {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            audio.play();
        });

        prevButton.addEventListener("click", function () {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
            audio.play();
        });


        /* WHEN SONG STARTS */

        audio.addEventListener("play", function () {

            albumWrapper.classList.add("playing");

            playIcon.innerHTML = `
                <path d="M6 5h4v14H6zm8 0h4v14h-4z"></path>
            `;

            playButton.setAttribute(
                "aria-label",
                "Pause"
            );

        });


        /* WHEN SONG PAUSES */

        audio.addEventListener("pause", function () {

            albumWrapper.classList.remove("playing");

            playIcon.innerHTML = `
                <path d="M8 5v14l11-7z"></path>
            `;

            playButton.setAttribute(
                "aria-label",
                "Play"
            );

        });


        /* UPDATE PROGRESS */

        audio.addEventListener("timeupdate", function () {

            if (!audio.duration) return;

            const progress =
                (audio.currentTime / audio.duration) * 100;

            progressFill.style.width =
                progress + "%";

            progressKnob.style.left =
                progress + "%";

            const currentMinutes =
                Math.floor(audio.currentTime / 60);

            const currentSeconds =
                Math.floor(audio.currentTime % 60)
                    .toString()
                    .padStart(2, "0");

            const totalMinutes =
                Math.floor(audio.duration / 60);

            const totalSeconds =
                Math.floor(audio.duration % 60)
                    .toString()
                    .padStart(2, "0");

            timeDisplay.textContent =
                `${currentMinutes}:${currentSeconds} / ${totalMinutes}:${totalSeconds}`;

        });


        /* CLICK TO SEEK */

        progressBar.addEventListener(
            "click",
            function (event) {

                if (!audio.duration) return;

                const rect =
                    progressBar.getBoundingClientRect();

                const clickPosition =
                    event.clientX - rect.left;

                const percentage =
                    clickPosition / rect.width;

                audio.currentTime =
                    percentage * audio.duration;

            }
        );


        /* WHEN SONG ENDS (Auto-advance to next track) */

        audio.addEventListener("ended", function () {

            progressFill.style.width = "0%";
            progressKnob.style.left = "0%";

            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            audio.play();

        });



        /* =========================
           LIVE VIEWER DISPLAY
        ========================== */

        const viewerCount =
            document.getElementById("viewerCount");

        let displayedViewers =
            Math.floor(Math.random() * 71) + 30;

        viewerCount.textContent =
            displayedViewers;


        function updateViewerCount() {
            const newViewers =
                Math.floor(Math.random() * 71) + 30;

            displayedViewers =
                newViewers;

            viewerCount.textContent =
                displayedViewers;
        }

        setInterval(
            updateViewerCount,
            10000
        );
    </script>

</body>
</html>
